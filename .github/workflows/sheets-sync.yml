name: sheets-sync

# Every parameter arrives with the dispatch. No repository variable holds a
# spreadsheet id, and there is no cron: a run with no caller has nothing to act on.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which run: a plain import/export, or the database rebuild"
        type: choice
        options: [import, export, database]
        required: true
        default: import
      execution:
        description: "manual = the manual checkbox column, trigger = the scheduled one"
        type: choice
        options: [manual, trigger]
        required: true
        default: manual
      settings_spreadsheet_id:
        description: "Spreadsheet holding the Import/Export Settings tabs"
        required: true
      requested_by:
        description: "Email written to the status block (J4)"
        required: false
        default: ""
      timezone:
        description: "Spreadsheet timezone, used for the J3 timestamp"
        required: false
        default: "UTC"
      jobs_json:
        description: "Inline job list; on a retry this is the rows that did not make it"
        required: false
        default: ""
      database_config:
        description: "Database layout JSON (transaction_length, keep_columns, ai_ranges, ...)"
        required: false
        default: ""
      attempt:
        description: "Attempt number; the sheet always sends 1"
        required: false
        default: "1"
      not_before:
        description: "ISO timestamp the run should wait for (set by a scheduled retry)"
        required: false
        default: ""
      dry_run:
        description: "List the rows that would run and write nothing"
        type: boolean
        required: false
        default: false

concurrency:
  # Attempt is part of the key so a waiting retry never blocks a fresh click.
  group: sheets-sync-${{ inputs.settings_spreadsheet_id }}-${{ inputs.mode }}-${{ inputs.attempt }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A retry run starts at once and waits here. The cap bounds runner time.
      - name: Wait for the scheduled retry time
        if: inputs.not_before != ''
        env:
          NOT_BEFORE: ${{ inputs.not_before }}
          MAX_WAIT_MINUTES: ${{ vars.MAX_WAIT_MINUTES || '120' }}
        run: |
          python - <<'PY'
          import os, time
          from datetime import datetime, timezone
          target = datetime.fromisoformat(os.environ["NOT_BEFORE"])
          cap = float(os.environ["MAX_WAIT_MINUTES"]) * 60
          wait = min(max((target - datetime.now(timezone.utc)).total_seconds(), 0), cap)
          print(f"waiting {wait:.0f}s until {target.isoformat()}")
          time.sleep(wait)
          PY

      - name: Run ${{ inputs.mode }} (attempt ${{ inputs.attempt }})
        id: sync
        # Inputs go through env, never ${{ }} in the script body: two of them
        # are JSON and their quotes would close the shell's.
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SA_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SS_MODE: ${{ inputs.mode }}
          SS_EXECUTION: ${{ inputs.execution }}
          SS_SPREADSHEET_ID: ${{ inputs.settings_spreadsheet_id }}
          SS_REQUESTED_BY: ${{ inputs.requested_by }}
          SS_TIMEZONE: ${{ inputs.timezone || 'UTC' }}
          SS_JOBS_JSON: ${{ inputs.jobs_json }}
          SS_DATABASE_CONFIG: ${{ inputs.database_config }}
          SS_ATTEMPT: ${{ inputs.attempt }}
          SS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN=""
          if [ "$SS_DRY_RUN" = "true" ]; then DRY_RUN="--dry-run"; fi
          python -m sheets_sync $DRY_RUN \
            --mode "$SS_MODE" \
            --execution "$SS_EXECUTION" \
            --settings-spreadsheet-id "$SS_SPREADSHEET_ID" \
            --user "$SS_REQUESTED_BY" \
            --timezone "$SS_TIMEZONE" \
            --jobs-json "$SS_JOBS_JSON" \
            --database-config "$SS_DATABASE_CONFIG" \
            --attempt "$SS_ATTEMPT" \
            --retry-file retry.json

      # Needs a PAT: events created with the built-in GITHUB_TOKEN do not start
      # new workflow runs.
      - name: Schedule the retry
        if: always() && steps.sync.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ secrets.RETRY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::rows were deferred but RETRY_DISPATCH_TOKEN is not set, so no retry was scheduled"
            exit 1
          fi
          jq -c --arg ref "${GITHUB_REF_NAME}" '{ref: $ref, inputs: .inputs}' retry.json \
            | gh api --method POST \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/sheets-sync.yml/dispatches" \
                --input -
          echo "::notice::retry $(jq -r '.attempt' retry.json) scheduled for $(jq -r '.not_before' retry.json)"
